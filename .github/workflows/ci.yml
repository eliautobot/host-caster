# Host-Caster CI: web app + server (tests, build), Android debug APK, unsigned iOS simulator build.
# Nothing here needs secrets; the native builds are debug/unsigned and are uploaded as workflow artifacts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  web:
    name: Web app + server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json
      - name: Install (app)
        working-directory: app
        run: npm ci
      - name: Install (server)
        working-directory: server
        run: npm ci
      - name: Typecheck
        working-directory: app
        run: npm run typecheck
      - name: Unit tests (app)
        working-directory: app
        run: npm test
      - name: Tests (server)
        working-directory: server
        run: npm test
      - name: Build web app
        working-directory: app
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: hostcaster-web
          path: app/dist
          retention-days: 14

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Install
        working-directory: app
        run: npm ci
      - name: Build web app
        working-directory: app
        run: npm run build
      - name: Copy web app + plugins into the Android project
        working-directory: app
        run: npx cap sync android
      - name: Assemble debug APK
        working-directory: app/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hostcaster-android-debug
          path: app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  ios:
    name: iOS simulator build (unsigned)
    # Capacitor 8 needs Xcode 26+
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Build web app
        working-directory: app
        run: npm run build
      - name: Copy web app + plugins into the iOS project
        working-directory: app
        run: npx cap sync ios
      - name: Build for the simulator
        working-directory: app/ios/App
        run: |
          mkdir -p build
          if ! xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild.log 2>&1; then
            grep -E "error:" build/xcodebuild.log | head -80 || true
            tail -60 build/xcodebuild.log
            exit 1
          fi
          grep -E "warning: .*HostCaster" build/xcodebuild.log | head -40 || true
          tail -3 build/xcodebuild.log
          test -d build/DerivedData/Build/Products/Debug-iphonesimulator/App.app
      - name: Zip the app
        if: success()
        working-directory: app/ios/App/build/DerivedData/Build/Products/Debug-iphonesimulator
        run: ditto -c -k --keepParent App.app "$GITHUB_WORKSPACE/hostcaster-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hostcaster-ios-simulator
          path: hostcaster-ios-simulator.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hostcaster-ios-build-log
          path: app/ios/App/build/xcodebuild.log
